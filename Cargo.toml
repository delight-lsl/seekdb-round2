[package]
name = "minivectordb"
version = "0.1.0"
edition = "2021"
description = "Lightweight single-node transactional vector database in Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
